<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Add Employee</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>
<header>
    <img th:src="@{/images/logo.jpg}" alt="Company Logo" class="logo">
    <h1>Employee Management System</h1>
</header>

<div class="container">
    <h2>Add New Employee</h2>

    <form action="#" th:action="@{/addEmployee}" th:object="${employee}" method="post">
        <div class="form-group">
            <label for="firstName">First Name:</label>
            <input type="text" id="firstName" th:field="*{firstName}" placeholder="First name">
            <span class="error" th:if="${#fields.hasErrors('firstName')}" th:errors="*{firstName}"></span>
        </div>

        <div class="form-group">
            <label for="lastName">Last Name:</label>
            <input type="text" id="lastName" th:field="*{lastName}" placeholder="Last name">
            <span class="error" th:if="${#fields.hasErrors('lastName')}" th:errors="*{lastName}"></span>
        </div>

        <div class="form-group">
            <label for="emailId">Email:</label>
            <input type="email" id="emailId" th:field="*{emailId}" placeholder="Email">
            <span class="error" th:if="${#fields.hasErrors('emailId')}" th:errors="*{emailId}"></span>
        </div>

        <div class="form-group">
            <input type="submit" value="Save" class="btn">
            <a href="/" class="btn btn-secondary">Cancel</a>
        </div>
    </form>
</div>

<footer>
    <p>&copy; 2025 Employee Management System</p>
</footer>
</body>
</html>
