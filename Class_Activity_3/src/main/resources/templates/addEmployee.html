<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Add Employee</title>
</head>
<body>
<h1>Add New Employee</h1>

<form action="#" th:action="@{/addEmployee}" th:object="${employee}" method="post">
    First Name: <input type="text" th:field="*{firstName}" placeholder="First name" required><br><br>
    Last Name: <input type="text" th:field="*{lastName}" placeholder="Last name" required><br><br>
    Email Id: <input type="text" th:field="*{emailId}" placeholder="Email" required><br><br>
    <input type="submit" value="Save">
</form>
</body>
</html>
