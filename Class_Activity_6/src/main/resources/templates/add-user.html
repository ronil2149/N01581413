<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Add User</title>
</head>
<body>
<div align="center">
  <h1>User Sign Up</h1>
  <form action="#" method="post" th:action="@{/signup}" th:object="${user}">
    <table>
      <tr>
        <td>First Name</td>
        <td><input th:field="*{firstName}" type="text" required></td>
      </tr>
      <tr>
        <td>Last Name</td>
        <td><input th:field="*{lastName}" type="text" required></td>
      </tr>
      <tr>
        <td>User Name</td>
        <td><input th:field="*{username}" type="text" required></td>
      </tr>
      <tr>
        <td>Password</td>
        <td><input th:field="*{password}" type="password" required></td>
      </tr>
      <tr>
        <td>Email</td>
        <td><input th:field="*{email}" type="email" required></td>
      </tr>
      <tr>
        <td>Date of Birth</td>
        <td><input th:field="*{dob}" type="date" required></td>
      </tr>
      <tr>
        <td></td>
        <td><input type="submit" value="Sign Up"></td>
      </tr>
    </table>
  </form>
</div>
</body>
</html>
