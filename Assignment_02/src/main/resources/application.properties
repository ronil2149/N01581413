spring.application.name=Assignment_02

spring.thymeleaf.cache=false
# MySQL Database Connection
spring.datasource.url=jdbc:mysql://localhost:3306/asn2
spring.datasource.username=root
spring.datasource.password=12345

# Hibernate Properties (JPA Implementation)
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect

# Options: update, create, create-drop, validate, none
spring.jpa.hibernate.ddl-auto=update

# Show generated SQL in logs
spring.jpa.show-sql=true

# Set logging level for application packages
logging.level.root=INFO
logging.level.com.example=DEBUG
logging.level.org.springframework=WARN

