<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Add User</title>
  <style>
    .error-message {
      color: #d9534f;
      margin: 15px auto;
      padding: 10px;
      max-width: 80%;
      background-color: #f8d7da;
      border: 1px solid #f5c6cb;
      border-radius: 4px;
      text-align: center;
    }
    .field-error {
      color: #d9534f;
      font-size: 0.9em;
      margin-top: 4px;
    }
  </style>
</head>
<body>
<div align="center">
  <h1>User Sign Up</h1>

  <!-- General error message display -->
  <div class="error-message"
       style="display: none;"
       th:style="${errorMessage != null} ? 'display: block;' : 'display: none;'"
       th:text="${errorMessage}"></div>

  <form action="#" method="post" th:action="@{/signup}" th:object="${user}">
    <table>
      <tr>
        <td>First Name</td>
        <td>
          <input th:field="*{firstName}" type="text" required>
          <div class="field-error" th:if="${#fields.hasErrors('firstName')}" th:errors="*{firstName}"></div>
        </td>
      </tr>
      <tr>
        <td>Last Name</td>
        <td>
          <input th:field="*{lastName}" type="text" required>
          <div class="field-error" th:if="${#fields.hasErrors('lastName')}" th:errors="*{lastName}"></div>
        </td>
      </tr>
      <tr>
        <td>User Name</td>
        <td>
          <input th:field="*{username}" type="text" required>
          <div class="field-error" th:if="${#fields.hasErrors('username')}" th:errors="*{username}"></div>
        </td>
      </tr>
      <tr>
        <td>Password</td>
        <td>
          <input th:field="*{password}" type="password" required>
          <div class="field-error" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></div>
        </td>
      </tr>
      <tr>
        <td>Email</td>
        <td>
          <input th:field="*{email}" type="email" required>
          <div class="field-error" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
        </td>
      </tr>
      <tr>
        <td>Date of Birth</td>
        <td>
          <input th:field="*{dob}" type="date" required>
          <div class="field-error" th:if="${#fields.hasErrors('dob')}" th:errors="*{dob}"></div>
        </td>
      </tr>
      <tr>
        <td></td>
        <td><input type="submit" value="Sign Up"></td>
      </tr>
    </table>
  </form>

  <div style="margin-top: 20px;">
    Already have an account? <a th:href="@{/}">Login here</a>
  </div>
</div>
</body>
</html>
