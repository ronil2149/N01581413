<!DOCTYPE html>
<html lang="en">
<head>
    <title>Edit Product</title>
</head>
<body>
<h1>Edit Product</h1>
<form action="/products/update/{id}" method="post">
    <input type="hidden" name="id" th:value="${product.id}">

    <label for="name">Product Name:</label>
    <input type="text" id="name" name="name" th:value="${product.name}" required><br><br>

    <label for="description">Description:</label>
    <input type="text" id="description" name="description" th:value="${product.description}" required><br><br>

    <label for="price">Price:</label>
    <input type="number" id="price" name="price" th:value="${product.price}" step="0.01" required><br><br>

    <label for="stock">Stock Quantity:</label>
    <input type="number" id="stock" name="stock" th:value="${product.stock}" required><br><br>

    <button type="submit">Update Product</button>
</form>
<a href="/products">Back to Product List</a>
</body>
</html>
